services:
  # 当前用一个容器同时运行 API、用户页面和管理后台。
  assistant:
    # 使用项目根目录的 Dockerfile 构建镜像。
    build: .
    # 使用轻量 init 进程转发信号并回收子进程。
    init: true
    # 将容器内端口映射到宿主机，便于在浏览器访问。
    ports:
      - "3000:3000" # API
      - "5173:5173" # 用户入口页面
      - "5174:5174" # 管理后台
    # OrbStack 默认只给 service 域名自动探测一个网页端口；显式指定用户端口。
    # 再为管理后台和 API 配置各自的域名，避免三个服务共用一个域名时路由不明确。
    labels:
      - dev.orbstack.http-port=5173
      - dev.orbstack.domains=admin.zhushou.orb.local@5174,api.zhushou.orb.local@3000
    # 容器运行时使用的配置；敏感值从项目根目录的 .env 读取。
    environment:
      # 监听所有容器网络接口，否则宿主机无法访问服务。
      HOST: "0.0.0.0"
      VITE_HOST: "0.0.0.0"
      PORT: "3000"
      # SQLite 数据库存放在容器的数据目录中。
      DATABASE_PATH: /app/data/knowledge.db
      # 阿里云百炼（千问）模型配置。
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      # 搜索工具的 API Key。
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # 腾讯云语音识别凭证。
      TENCENT_ASR_APP_ID: ${TENCENT_ASR_APP_ID:-}
      TENCENT_ASR_SECRET_ID: ${TENCENT_ASR_SECRET_ID:-}
      TENCENT_ASR_SECRET_KEY: ${TENCENT_ASR_SECRET_KEY:-}
      # 火山引擎语音合成配置。
      VOLCENGINE_TTS_APP_ID: ${VOLCENGINE_TTS_APP_ID:-}
      VOLCENGINE_TTS_ACCESS_TOKEN: ${VOLCENGINE_TTS_ACCESS_TOKEN:-}
      VOLCENGINE_TTS_RESOURCE_ID: ${VOLCENGINE_TTS_RESOURCE_ID:-seed-tts-1.0}
      VOLCENGINE_TTS_VOICE_TYPE: ${VOLCENGINE_TTS_VOICE_TYPE:-}
      VOLCENGINE_TTS_ENCODING: ${VOLCENGINE_TTS_ENCODING:-mp3}
    # 将宿主机 data 目录挂载进容器，容器重建后仍保留 SQLite 数据。
    volumes:
      - ./data:/app/data
