services:
  assistant:
    build:
      context: .
      dockerfile: Dockerfile.release
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    init: true
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      WEB_DIST_DIR: /app/web/dist
      ADMIN_DIST_DIR: /app/admin/dist
      DATABASE_PATH: /app/data/knowledge.db
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TENCENT_ASR_APP_ID: ${TENCENT_ASR_APP_ID:-}
      TENCENT_ASR_SECRET_ID: ${TENCENT_ASR_SECRET_ID:-}
      TENCENT_ASR_SECRET_KEY: ${TENCENT_ASR_SECRET_KEY:-}
      VOLCENGINE_TTS_APP_ID: ${VOLCENGINE_TTS_APP_ID:-}
      VOLCENGINE_TTS_ACCESS_TOKEN: ${VOLCENGINE_TTS_ACCESS_TOKEN:-}
      VOLCENGINE_TTS_RESOURCE_ID: ${VOLCENGINE_TTS_RESOURCE_ID:-seed-tts-1.0}
      VOLCENGINE_TTS_VOICE_TYPE: ${VOLCENGINE_TTS_VOICE_TYPE:-}
      VOLCENGINE_TTS_ENCODING: ${VOLCENGINE_TTS_ENCODING:-mp3}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
